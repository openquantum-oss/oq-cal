name: GitHub release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open the v0.1.1 GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo "Release v0.1.1 already exists"
            exit 0
          fi
          gh release create v0.1.1 \
            --title "oq-cal 0.1.1" \
            --target dd4b7915db2bb894cc7324c5dafe0cd4cd24c1ed \
            --notes-file .github/release-notes-0.1.1.md
